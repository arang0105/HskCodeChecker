# Streamlit 설정. **이 파일은 커밋한다** — 배포에도 그대로 적용돼야 한다.
# 비밀은 여기 넣지 않는다. API 키는 .streamlit/secrets.toml 이고 그쪽은
# .gitignore 에 들어 있다.

[server]
# 업로드 파일 1개당 상한(MB).
#
# 기본값이 200MB 라 업로더 위젯에 "200MB per file" 이 찍혔는데, 바로 옆에
# 우리가 적은 "합계 10MB 까지" 와 숫자가 어긋나 보였다. 사용자는 둘 중
# 어느 쪽이 진짜인지 알 수 없다.
#
# 이 값을 맞추면 위젯이 스스로 "10MB per file" 이라고 말한다. 그리고
# 애초에 서버가 큰 파일을 받지 않으므로, app.py 의 합계 검사보다 **앞에서**
# 막힌다 — 200MB 를 다 받아 놓고 거부하는 것보다 낫다.
#
# pipeline.CATALOG_MAX_MB 와 같은 값이어야 한다. 한쪽만 고치지 말 것.
maxUploadSize = 10
